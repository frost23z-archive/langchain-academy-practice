[project]
name = "lc-foundations"
version = "0.1.0"
description = "LangChain foundations demo"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
    "langchain-openrouter>=0.2.9",
    "langchain-tavily>=0.2.18",
    "langchain[mcp]>=1.4.10",
    "langgraph>=1.2.20",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "tavily>=1.1.0",
    "tavily-python>=0.8.5",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
